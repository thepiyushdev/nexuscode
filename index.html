<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NexusCode — Autonomous AI Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .code-font { font-family: 'Fira Code', monospace; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#090D16] text-slate-100 min-h-screen flex flex-col overflow-x-hidden">

  <!-- TOP HEADER -->
  <header class="px-4 py-2.5 bg-[#0D1322] border-b border-slate-800 flex items-center justify-between sticky top-0 z-30">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 via-indigo-500 to-fuchsia-500 flex items-center justify-center font-black text-slate-950 text-sm shadow-md">
        N
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="font-extrabold text-sm text-white tracking-tight">NexusCode</h1>
          <span class="text-[9px] bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-1.5 py-0.2 rounded font-mono">Consensus v2</span>
        </div>
        <p class="text-[10px] text-slate-400">Gemini • Grok • Mistral • OpenRouter</p>
      </div>
    </div>

    <!-- Mode Switcher & Export -->
    <div class="flex items-center gap-2">
      <button onclick="downloadCode()" class="p-2 bg-slate-800 hover:bg-slate-700 text-xs rounded-xl font-semibold text-slate-300" title="Download HTML">
        💾 Export
      </button>
      <div class="flex bg-slate-900 border border-slate-800 rounded-xl p-0.5 text-xs font-semibold">
        <button id="viewEditorBtn" onclick="setView('editor')" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white">Code</button>
        <button id="viewPreviewBtn" onclick="setView('preview')" class="px-3 py-1.5 rounded-lg text-slate-400 hover:text-white">Live App</button>
      </div>
    </div>
  </header>

  <!-- CONSENSUS PROGRESS DRAWER -->
  <div id="agentStatusTray" class="hidden px-4 py-2 bg-slate-900/90 border-b border-slate-800 text-xs flex flex-wrap items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></span>
      <span id="agentStatusText" class="font-medium text-slate-300">Agents deliberating...</span>
    </div>
    <div id="agentBadges" class="flex gap-1.5"></div>
  </div>

  <!-- WORKSPACE (EDITOR & LIVE PREVIEW) -->
  <main class="flex-1 flex flex-col md:flex-row h-[calc(100vh-140px)] overflow-hidden">
    
    <!-- Code Editor Section -->
    <section id="editorPane" class="flex-1 flex flex-col border-b md:border-b-0 md:border-r border-slate-800 bg-[#070A10]">
      <div class="px-4 py-2 bg-slate-900/60 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400 font-mono">
        <span>index.html</span>
        <button onclick="refreshLiveSandbox()" class="text-cyan-400 hover:underline">▶ Run Sandbox</button>
      </div>
      <textarea id="codeEditor" spellcheck="false" class="flex-1 w-full bg-transparent p-4 text-xs md:text-sm text-cyan-200 code-font outline-none resize-none leading-relaxed" placeholder="Code will be synthesized here..."></textarea>
    </section>

    <!-- Live Preview Sandbox -->
    <section id="previewPane" class="flex-1 hidden md:flex flex-col bg-white">
      <iframe id="liveSandbox" class="w-full h-full border-none"></iframe>
    </section>
  </main>

  <!-- BOTTOM PROMPT DOCK -->
  <footer class="p-3 bg-[#0D1322] border-t border-slate-800 sticky bottom-0 z-30">
    <div class="max-w-4xl mx-auto flex items-center gap-2 bg-[#12192C] border border-slate-700/80 rounded-2xl px-3 py-1.5 focus-within:border-cyan-500 transition">
      <input id="promptInput" type="text" onkeydown="if(event.key==='Enter') triggerNexusBuild()" placeholder="Prompt what to build... (e.g. Modern crypto portfolio tracker with charts)" class="w-full bg-transparent text-xs md:text-sm text-white placeholder-slate-500 outline-none py-1.5" />
      <button id="generateBtn" onclick="triggerNexusBuild()" class="px-4 py-2 bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg transition flex items-center gap-1.5 whitespace-nowrap">
        <span>⚡ Generate</span>
      </button>
    </div>
  </footer>

  <script>
    let currentView = 'editor';

    function setView(view) {
      currentView = view;
      const editor = document.getElementById("editorPane");
      const preview = document.getElementById("previewPane");
      const btnEdit = document.getElementById("viewEditorBtn");
      const btnPrev = document.getElementById("viewPreviewBtn");

      if (view === 'editor') {
        editor.classList.remove("hidden");
        preview.classList.add("hidden");
        btnEdit.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white";
        btnPrev.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white";
      } else {
        editor.classList.add("hidden");
        preview.classList.remove("hidden");
        preview.classList.add("flex");
        btnPrev.className = "px-3 py-1.5 rounded-lg bg-indigo-600 text-white";
        btnEdit.className = "px-3 py-1.5 rounded-lg text-slate-400 hover:text-white";
        refreshLiveSandbox();
      }
    }

    function refreshLiveSandbox() {
      const code = document.getElementById("codeEditor").value;
      const iframe = document.getElementById("liveSandbox");
      iframe.srcdoc = code;
    }

    async function triggerNexusBuild() {
      const inp = document.getElementById("promptInput");
      const prompt = inp.value.trim();
      if (!prompt) return;

      const btn = document.getElementById("generateBtn");
      const tray = document.getElementById("agentStatusTray");
      const statusText = document.getElementById("agentStatusText");
      const badges = document.getElementById("agentBadges");

      btn.disabled = true;
      btn.innerText = "Building...";
      tray.classList.remove("hidden");
      statusText.innerText = "Multi-LLM Consensus in progress: Designing -> Synthesizing -> Hardening...";
      badges.innerHTML = "";

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Build failed');

        document.getElementById("codeEditor").value = data.code;
        refreshLiveSandbox();

        statusText.innerText = "✅ Build Complete (Consensus reached)";
        badges.innerHTML = data.stages.map(s => `
          <span class="px-2 py-0.5 bg-slate-800 border border-slate-700 rounded text-[10px] text-cyan-300 font-mono">${s.provider}</span>
        `).join('');

        // Mobile par automatically preview par switch karo
        if (window.innerWidth < 768) {
          setView('preview');
        }
      } catch (err) {
        statusText.innerText = `❌ Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ Generate";
      }
    }

    function downloadCode() {
      const code = document.getElementById("codeEditor").value;
      if (!code) return alert("Code editor is empty!");
      const blob = new Blob([code], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "index.html";
      a.click();
    }

    // Default Starter Template
    window.onload = () => {
      document.getElementById("codeEditor").value = `<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-6 text-center">
  <div>
    <h1 class="text-3xl font-extrabold text-cyan-400">NexusCode Ready</h1>
    <p class="text-sm text-slate-400 mt-2">Enter any prompt below to synthesize production apps.</p>
  </div>
</body>
</html>`;
      refreshLiveSandbox();
    };
  </script>
</body>
</html>
